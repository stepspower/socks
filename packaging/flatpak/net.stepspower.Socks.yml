app-id: net.stepspower.Socks
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# PySide6 comes from the Flathub BaseApp (built against this exact Qt), so PySide6-Essentials
# is deliberately NOT in python3-deps.json. See docs/DECISIONS.md (PACKAGING).
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: socks
cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  # Bluetooth LE to the car through BlueZ (bleak talks to org.bluez on the system bus)
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  - --talk-name=org.freedesktop.Notifications
  # Tray icon (StatusNotifierItem). Open question: drop if the tray is removed from the GUI.
  - --talk-name=org.kde.StatusNotifierWatcher
  # No filesystem access: keys/tokens/DB live in the sandboxed XDG dirs. Importing an existing
  # key goes through the file chooser portal. org.freedesktop.secrets is NOT requested
  # because the code does not use the keyring.

modules:
  # Generated by gen-python-deps.py (flatpak-pip-generator stand-in); regenerate on dep bumps.
  - python3-deps.json

  - name: socks
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation .
      - install -Dm644 packaging/net.stepspower.Socks.desktop -t /app/share/applications/
      - install -Dm644 packaging/net.stepspower.Socks.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 data/icons/socks.svg /app/share/icons/hicolor/scalable/apps/net.stepspower.Socks.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - .git
          - .flatpak-builder
          - build
