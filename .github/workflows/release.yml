name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v0.1.0)"
        required: true
      only:
        description: "Which job to run"
        type: choice
        default: rpm
        options: [all, dist, deb, rpm, flatpak]

permissions:
  contents: read

jobs:
  dist:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'dist' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build sdist and wheel
        run: uv build --python 3.13 -o dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  deb:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'deb' }}
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential fakeroot \
            debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools python3-pip \
            desktop-file-utils appstream
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build .deb
        run: |
          cp -r packaging/debian debian
          dpkg-buildpackage -b -us -uc
          mkdir -p out && cp ../socks-tesla_*.deb out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: out/*.deb

  rpm:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'rpm' }}
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - name: Install build tools
        run: dnf install -y rpm-build dnf-plugins-core python3-pip git tar gzip
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Use the spec from the dispatching ref (lets a fixed spec rebuild an old tag)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
      - name: Overlay spec
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cp ci/packaging/rpm/socks-tesla.spec packaging/rpm/socks-tesla.spec
      - name: Build .rpm
        run: |
          dnf builddep -y packaging/rpm/socks-tesla.spec
          # name the tarball after the spec, not the tag (rc tags look like v0.1.0-rc2)
          VERSION=$(sed -n 's/^Version: *//p' packaging/rpm/socks-tesla.spec)
          mkdir -p ~/rpmbuild/SOURCES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz --prefix="socks-${VERSION}/" -o ~/rpmbuild/SOURCES/socks-${VERSION}.tar.gz HEAD
          rpmbuild -ba packaging/rpm/socks-tesla.spec
          mkdir -p out && cp ~/rpmbuild/RPMS/*/socks-tesla-*.rpm ~/rpmbuild/SRPMS/*.src.rpm out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: out/*.rpm

  flatpak:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'flatpak' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Make a CI variant of the manifest that builds the checked-out tree
        # The committed manifest uses the git tag source (what Flathub needs); the tag may not
        # be pushed or the commit pin may be unset yet, so CI builds the tree it checked out.
        run: |
          python3 - <<'PY'
          import re
          p = "packaging/flatpak/net.stepspower.Socks.yml"
          s = open(p).read()
          new, n = re.subn(
              r"      - type: git\n(?:        .*\n)+",
              "      - type: dir\n        path: ../..\n        skip: [.git]\n",
              s,
          )
          assert n == 1, "git source block not found in the manifest"
          open("packaging/flatpak/ci.net.stepspower.Socks.yml", "w").write(new)
          PY
          grep -n -A3 "type: dir" packaging/flatpak/ci.net.stepspower.Socks.yml
      - uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: socks.flatpak
          manifest-path: packaging/flatpak/ci.net.stepspower.Socks.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: socks.flatpak

  release:
    needs: [dist, deb, rpm, flatpak]
    # Publish whatever was built. On a push, only the wheel/sdist job is mandatory; a manual
    # run just attaches the artifacts of the jobs it ran to the existing release.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.dist.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        if: ${{ github.event_name == 'push' }}
        run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ github.event_name == 'push' }}
        with:
          files: artifacts/*
          generate_release_notes: true
      - name: Attach to the existing release (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
