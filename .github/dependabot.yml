version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock). Minor/patch updates are grouped into one PR;
  # the two libraries that can change behaviour toward the car or the UI get their own PRs.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["deps"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "tesla-fleet-api"
          - "PySide6-Essentials"
          - "pyside6-essentials"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["deps"]
